<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal PT. KJP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      color: #1d4ed8;
    }

    .status {
      margin-top: 24px;
      padding: 14px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Portal PT. KJP</h1>
    <p>Portal sedang disiapkan untuk migrasi ke GitHub Pages.</p>

    <div class="status">
      Halaman GitHub Pages berhasil dimuat.
    </div>
  </main>
</body>
</html>
